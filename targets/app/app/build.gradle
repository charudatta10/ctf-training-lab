plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glowmart.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.glowmart.mobile'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.3.0'

        ndk {
            abiFilters 'x86_64', 'x86', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}